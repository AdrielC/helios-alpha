name: Operator application

on:
  push:
    branches: [main]
    paths:
      - "apps/operator/**"
      - "packages/atlas-charts/**"
      - "package.json"
      - "package-lock.json"
      - ".vercelignore"
      - "vercel.json"
      - ".github/workflows/operator.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/operator/**"
      - "packages/atlas-charts/**"
      - "package.json"
      - "package-lock.json"
      - ".vercelignore"
      - "vercel.json"
      - ".github/workflows/operator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test Atlas chart primitives
        run: npm run atlas:test

      - name: Typecheck and build operator
        run: npm run operator:build

      - name: Enforce operator bundle budgets
        run: npm run operator:check-performance

      - name: Install browser for operator acceptance tests
        run: npx playwright install --with-deps chromium

      - name: Test operator interactions and responsive layout
        run: npm run operator:e2e

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Upload operator artifact
        uses: actions/upload-artifact@v6
        with:
          name: helios-control
          path: apps/operator/dist
          if-no-files-found: error
