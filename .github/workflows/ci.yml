name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package and dev deps
        run: |
          python -m pip install -U pip setuptools wheel
          pip install -e ".[dev,execution]"

      - name: Ruff
        run: python -m ruff check src/helios_alpha tests

      - name: Pytest (unit)
        run: python -m pytest tests/ -m "not integration" -v --tb=short

  python-integration:
    runs-on: ubuntu-latest
    # Network + external APIs; run on main and PRs but don't block merges if NASA/SWPC blip
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install -U pip setuptools wheel
          pip install -e ".[dev,execution]"

      - name: Pytest (integration)
        run: python -m pytest tests/ -m integration -v --tb=short

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libzmq3-dev pkg-config g++

      - name: Install wasm target (backtest web UI)
        working-directory: rust
        run: rustup target add wasm32-unknown-unknown wasm32-wasip2

      - name: Cargo test + build (workspace)
        working-directory: rust
        run: |
          rustc --version
          cargo test
          cargo test -p helio_robinhood --all-features
          cargo clippy -p helio_execution -p helio_oms -p helio_robinhood --all-targets --all-features -- -D warnings
          cargo test -p helio_hypothesis --all-features
          cargo check --target wasm32-wasip2 -p helio_scan -p helio_time -p helio_stats -p helio_window -p helio_hypothesis -p helio_execution -p helio_oms -p helio_robinhood --no-default-features
          cargo bench -p helio_bench --bench hypothesis_machine --no-run
          cargo bench -p helio_bench --bench oms_lifecycle --no-run
          cargo check -p helio_backtest_wasm --target wasm32-unknown-unknown
          cargo build --release -p helios_signald

  capital-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install focused proof dependencies
        run: |
          python -m pip install -U pip
          python -m pip install \
            "exchange-calendars==4.13.2" "pendulum>=3" "pyyaml>=6" "pytest>=8"
          rustup target add wasm32-wasip2

      - name: Run portable capital-control proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          CARGO_INCREMENTAL=0 RUSTFLAGS="-C debuginfo=0" \
            cargo test --manifest-path rust/Cargo.toml \
              -p helio_scan -p helio_time -p helio_execution -p helio_oms -p helio_robinhood \
              2>&1 | tee evidence/rust-control-tests.log
          CARGO_INCREMENTAL=0 RUSTFLAGS="-C debuginfo=0" \
            cargo check --manifest-path rust/Cargo.toml \
              --target wasm32-wasip2 -p helio_execution -p helio_oms -p helio_robinhood --no-default-features \
              2>&1 | tee evidence/wasi-portability.log
          PYTHONPATH=src python -m pytest tests/test_calendar_manifest.py -q \
            2>&1 | tee evidence/venue-calendar-tests.log
          printf 'commit=%s\nrun_id=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            > evidence/context.txt
          sha256sum evidence/*.log evidence/context.txt > evidence/SHA256SUMS

      - name: Upload content-addressed proof logs
        uses: actions/upload-artifact@v6
        with:
          name: capital-control-tests-${{ github.sha }}
          path: evidence
          if-no-files-found: error

  golem:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOLEM_VERSION: v1.5.9
      GOLEM_LINUX_SHA256: 540b4183a0c80407a051500f1b5e3e698f3e8c3361a0df552995b71caf9acca4
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchains and WASI targets
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy --target wasm32-wasip2
          rustup target add wasm32-wasip2

      - name: Install pinned Golem CLI
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/golemcloud/golem/releases/download/${GOLEM_VERSION}/golem-x86_64-unknown-linux-gnu" \
            --output /tmp/golem
          echo "${GOLEM_LINUX_SHA256}  /tmp/golem" | sha256sum --check
          sudo install -m 0755 /tmp/golem /usr/local/bin/golem
          golem --version

      - name: Test portable durability kernel
        working-directory: rust
        run: |
          cargo test -p helio_golem
          cargo clippy -p helio_golem --all-targets -- -D warnings
          cargo check --target wasm32-wasip2 -p helio_golem --no-default-features

      - name: Test and build Golem WASM component
        working-directory: golem
        run: |
          cargo test
          cargo clippy --target wasm32-wasip2 --all-targets -- -D warnings
          golem build --yes

      - name: Prove Golem durability and idempotency
        working-directory: golem
        run: bash tests/golem_local_smoke.sh
