name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package and dev deps
        run: |
          python -m pip install -U pip setuptools wheel
          pip install -e ".[dev,execution]"

      - name: Ruff
        run: python -m ruff check src/helios_alpha tests

      - name: Pytest (unit)
        run: python -m pytest tests/ -m "not integration" -v --tb=short

  python-integration:
    runs-on: ubuntu-latest
    # Network + external APIs; run on main and PRs but don't block merges if NASA/SWPC blip
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install -U pip setuptools wheel
          pip install -e ".[dev,execution]"

      - name: Pytest (integration)
        run: python -m pytest tests/ -m integration -v --tb=short

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libzmq3-dev pkg-config g++

      - name: Install wasm target (backtest web UI)
        working-directory: rust
        run: rustup target add wasm32-unknown-unknown wasm32-wasip2

      - name: Cargo test + build (workspace)
        working-directory: rust
        run: |
          rustc --version
          cargo test
          cargo test -p helio_hypothesis --all-features
          cargo check --target wasm32-wasip2 -p helio_scan -p helio_time -p helio_stats -p helio_window -p helio_hypothesis --no-default-features
          cargo bench -p helio_bench --bench hypothesis_machine --no-run
          cargo check -p helio_backtest_wasm --target wasm32-unknown-unknown
          cargo build --release -p helios_signald

  golem:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOLEM_VERSION: v1.5.9
      GOLEM_LINUX_SHA256: 540b4183a0c80407a051500f1b5e3e698f3e8c3361a0df552995b71caf9acca4
    steps:
      - uses: actions/checkout@v7

      - name: Install WASI target
        run: rustup target add wasm32-wasip2

      - name: Install pinned Golem CLI
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/golemcloud/golem/releases/download/${GOLEM_VERSION}/golem-x86_64-unknown-linux-gnu" \
            --output /tmp/golem
          echo "${GOLEM_LINUX_SHA256}  /tmp/golem" | sha256sum --check
          sudo install -m 0755 /tmp/golem /usr/local/bin/golem
          golem --version

      - name: Test portable durability kernel
        working-directory: rust
        run: |
          cargo test -p helio_golem
          cargo clippy -p helio_golem --all-targets -- -D warnings
          cargo check --target wasm32-wasip2 -p helio_golem --no-default-features

      - name: Test and build Golem WASM component
        working-directory: golem
        run: |
          cargo test
          cargo clippy --target wasm32-wasip2 --all-targets -- -D warnings
          golem build --yes

      - name: Prove Golem durability and idempotency
        working-directory: golem
        run: bash tests/golem_local_smoke.sh
