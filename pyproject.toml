[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "helios-alpha"
version = "0.1.0"
description = "Research lab: space weather as a tradable risk factor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "exchange-calendars==4.13.2",
    "httpx>=0.27",
    "hydra-core>=1.3",
    "numpy>=1.26",
    "omegaconf>=2.3",
    "pandas>=2.1",
    "pendulum>=3.0",
    "polars>=1.0",
    "pyarrow>=15.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "yfinance>=0.2.40",
    "cdflib>=1.0",
]

[project.scripts]
helios-pipeline = "helios_alpha.cli:main"
helios-shadow = "helios_alpha.shadow.cli:main"
helios-control = "helios_alpha.control.cli:main"
helios-mcp = "helios_alpha.control.mcp_server:main"
helios-local = "helios_alpha.control.local:main"
helios-order-recovery = "helios_alpha.crypto.order_recovery:main"
helios-account-read = "helios_alpha.crypto.account_reader:main"
helios-allocation-value = "helios_alpha.crypto.valuation_reconciler:main"

[project.optional-dependencies]
dev = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "pytest>=8.0",
    "ruff>=0.6",
]
# Prophet only: Kats pins statsmodels==0.12.x and conflicts with our stack; install Kats in a separate venv if needed.
forecasting = [
    "prophet>=1.1",
]
execution = [
    "nats-py==2.12.0",
    "websockets==16.0",
    "defusedxml==0.7.1",
]
control = [
    "mcp==1.30.0",
    "cryptography==50.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/helios_alpha"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:hydra_pytest"
markers = [
    "integration: hits live APIs (run with pytest -m integration)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
