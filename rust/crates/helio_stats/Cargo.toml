[package]
name = "helio_stats"
version = "0.1.0"
edition = "2021"
description = "Mergeable, restartable online statistics for Helios stream pipelines"

[dependencies]
helio_scan = { path = "../helio_scan" }
hex = "0.4"
rand_chacha = "=0.3.1"
rand_core = "=0.6.4"
rand_distr = "=0.4.3"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
