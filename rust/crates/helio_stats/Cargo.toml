[package]
name = "helio_stats"
version = "0.1.0"
edition = "2021"
description = "Mergeable, restartable online statistics for Helios stream pipelines"

[dependencies]
helio_scan = { path = "../helio_scan" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
