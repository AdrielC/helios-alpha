[package]
name = "helios_signald"
version = "0.1.0"
edition = "2021"
description = "Durable NATS JetStream diagnostic consumer for Helios signals"

[dependencies]
async-nats = "0.50"
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[bin]]
name = "helios_signald"
path = "src/main.rs"
