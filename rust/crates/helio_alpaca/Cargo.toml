[package]
name = "helio_alpaca"
version = "0.1.0"
edition = "2021"
description = "Alpaca paper and live trading adapter for Helios broker and source ports"

[features]
default = []
native-http = ["dep:reqwest"]
native-stream = ["dep:futures-util", "dep:tokio", "dep:tokio-tungstenite"]

[dependencies]
helio_execution = { path = "../helio_execution" }
helio_scan = { path = "../helio_scan" }
hex = "0.4"
futures-util = { version = "0.3", features = ["sink"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["net"], optional = true }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "rustls-tls-webpki-roots"], optional = true }
zeroize = "1"
