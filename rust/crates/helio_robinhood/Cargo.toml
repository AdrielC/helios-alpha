[package]
name = "helio_robinhood"
version = "0.1.0"
edition = "2021"
description = "Official Robinhood Crypto API adapter for Helios broker ports"

[features]
default = []
native-http = ["dep:reqwest"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
ed25519-dalek = { version = "2", features = ["zeroize"] }
helio_execution = { path = "../helio_execution" }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = "1"
zeroize = "1"
