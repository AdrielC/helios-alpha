# Schema for IDEA:
# $schema: https://schema.golem.cloud/app/golem/1.5.0-rc2/golem.schema.json
# Schema for vscode-yaml:
# yaml-language-server: $schema=https://schema.golem.cloud/app/golem/1.5.0-rc2/golem.schema.json

# Field reference: https://learn.golem.cloud/app-manifest#field-reference
# Creating HTTP APIs: https://learn.golem.cloud/invoke/making-custom-apis

manifestVersion: 1.5.0

app: helios-alpha

environments:
  local:
    server: local
    componentPresets: debug
  test:
    # CI and the smoke test run a fresh local server with an isolated data directory.
    server: local
    componentPresets: debug
    cli:
      format: text
      autoConfirm: true
      reset: true
    deployment:
      compatibilityCheck: false
      versionCheck: false
  cloud:
    server: cloud
    componentPresets: release
components:
  helios:hypothesis-shard:
    dir: ""
    templates: rust
    # Path dependencies contain the durable control kernel; include them in build invalidation.
    presets:
      debug:
        buildMergeMode: replace
        build:
          - command: cargo build --locked --target wasm32-wasip2
            sources:
              - src
              - Cargo.toml
              - Cargo.lock
              - ../rust/Cargo.toml
              - ../rust/crates/*/Cargo.toml
              - ../rust/crates/*/src
            targets:
              - "{{ cargoTarget }}/wasm32-wasip2/debug/helios_hypothesis_shard.wasm"
      release:
        buildMergeMode: replace
        build:
          - command: cargo build --locked --target wasm32-wasip2 --release
            sources:
              - src
              - Cargo.toml
              - Cargo.lock
              - ../rust/Cargo.toml
              - ../rust/crates/*/Cargo.toml
              - ../rust/crates/*/src
            targets:
              - "{{ cargoTarget }}/wasm32-wasip2/release/helios_hypothesis_shard.wasm"

  helios:crypto-broker-journal:
    dir: broker-journal
    templates: rust
    presets:
      debug:
        buildMergeMode: replace
        build:
          - command: cargo build --locked --target wasm32-wasip2
            sources:
              - src
              - Cargo.toml
              - ../Cargo.toml
              - ../Cargo.lock
              - ../../rust/Cargo.toml
              - ../../rust/crates/*/Cargo.toml
              - ../../rust/crates/*/src
            targets:
              - "{{ cargoTarget }}/wasm32-wasip2/debug/helios_crypto_broker_journal.wasm"
      release:
        buildMergeMode: replace
        build:
          - command: cargo build --locked --target wasm32-wasip2 --release
            sources:
              - src
              - Cargo.toml
              - ../Cargo.toml
              - ../Cargo.lock
              - ../../rust/Cargo.toml
              - ../../rust/crates/*/Cargo.toml
              - ../../rust/crates/*/src
            targets:
              - "{{ cargoTarget }}/wasm32-wasip2/release/helios_crypto_broker_journal.wasm"

bridge:
  rust:
    agents:
      - OmsAccountAgent
      - ProjectionCursorAgent
      - RiskAccountAgent
