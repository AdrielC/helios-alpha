[package]
name = "helios_crypto_broker_journal"
version = "0.0.1"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
golem-rust = { version = "2.0.0", features = ["export_golem_agentic"] }
helio_crypto = { path = "../../rust/crates/helio_crypto" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
